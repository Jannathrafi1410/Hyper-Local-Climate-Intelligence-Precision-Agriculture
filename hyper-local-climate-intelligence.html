<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyper-Local Climate Intelligence &amp; Precision Agriculture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0B1E3D; --navy-2:#12294F; --navy-3:#1B3A6B;
  --emerald:#0E9F6B; --emerald-dk:#0B7F55;
  --amber:#C67C06; --amber-bg:#FFF4DE;
  --red:#D6362C; --red-bg:#FDEBEA;
  --blue:#2563A8; --blue-bg:#E9F2FB;
  --green-bg:#E7F7EF;
  --bg:#F4F6F9; --surface:#FFFFFF; --border:#E2E6ED; --border-2:#EDF0F4;
  --text:#0F1B2D; --muted:#5A6577; --faint:#8A93A3;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 8px rgba(16,24,40,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#111B2D; --border:#233049; --border-2:#1C2740;
    --text:#E8ECF3; --muted:#94A0B8; --faint:#5F6B82;
    --green-bg:#0E2A22; --amber-bg:#2E2410; --red-bg:#301516; --blue-bg:#0F2337;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111B2D; --border:#233049; --border-2:#1C2740;
  --text:#E8ECF3; --muted:#94A0B8; --faint:#5F6B82;
  --green-bg:#0E2A22; --amber-bg:#2E2410; --red-bg:#301516; --blue-bg:#0F2337;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',Inter,sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--emerald); outline-offset:2px;}
.mono-num{font-variant-numeric:tabular-nums;}

/* Layout shell */
#shell{display:flex; min-height:100%;}
#sidebar{
  width:250px; flex-shrink:0; background:var(--navy); color:#DCE4F2;
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:40; transition:transform .25s ease;
}
#main-col{flex:1; margin-left:250px; min-width:0; display:flex; flex-direction:column;}
.sb-brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
.sb-brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--emerald),#0B7F55);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-brand-text{font-family:'Space Grotesk';font-weight:600;font-size:14.5px;line-height:1.25;color:#fff;}
.sb-brand-sub{font-size:10.5px;color:#8FA2C4;letter-spacing:.01em;}
.sb-nav{flex:1; overflow-y:auto; padding:14px 10px;}
.sb-section-label{font-size:10.5px; color:#6E82AA; padding:14px 10px 6px; font-weight:600; letter-spacing:.03em;}
.sb-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px;
  color:#B7C3DC; font-size:13.4px; font-weight:500; margin-bottom:1px; position:relative;
}
.sb-item svg{flex-shrink:0; opacity:.85;}
.sb-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-item.active{background:rgba(14,159,107,.16); color:#fff;}
.sb-item.active svg{opacity:1; color:var(--emerald);}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--emerald);}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;}
.sb-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8FA2C4;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 3px rgba(14,159,107,.2);}

/* Topbar */
#topbar{
  position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 22px; display:flex; align-items:center; gap:14px; padding-top:calc(12px + env(safe-area-inset-top,0px));
}
.hamburger{display:none;}
#topbar .tb-title{font-family:'Space Grotesk';font-weight:600;font-size:17px;}
.farmpick{margin-left:auto; display:flex; align-items:center; gap:10px;}
.select-wrap{position:relative;}
select.pill-select{
  appearance:none; background:var(--bg); border:1px solid var(--border); border-radius:9px;
  padding:8px 30px 8px 12px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer;
}
.select-wrap::after{content:'';position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-65%) rotate(45deg);pointer-events:none;}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;}
.iconbtn:hover{background:var(--bg);}

#view{padding:22px; max-width:1400px; width:100%; margin:0 auto;}
@media(max-width:1000px){#view{padding:16px;}}

/* generic */
.grid{display:grid; gap:14px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:18px;}
.section-title{font-family:'Space Grotesk'; font-weight:600; font-size:15.5px; margin:0 0 2px;}
.section-sub{color:var(--muted); font-size:12.5px; margin:0 0 14px;}
.eyebrow{font-size:11px;color:var(--faint);font-weight:600;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge.green{background:var(--green-bg);color:var(--emerald-dk);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.blue{background:var(--blue-bg);color:var(--blue);}
.badge.gray{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.green{background:var(--emerald);} .dot.amber{background:var(--amber);} .dot.red{background:var(--red);} .dot.blue{background:var(--blue);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 15px;font-weight:600;font-size:13px;border:1px solid transparent;transition:transform .08s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-3);}
.btn-emerald{background:var(--emerald);color:#fff;}
.btn-emerald:hover{background:var(--emerald-dk);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--bg);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
hr.rule{border:none;border-top:1px solid var(--border-2);margin:14px 0;}
.skel{background:linear-gradient(90deg,var(--border-2) 25%,var(--border) 37%,var(--border-2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:2px 8px;border-radius:6px;letter-spacing:.02em;}
.fade-in{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.hoverlift{transition:box-shadow .15s ease, transform .15s ease;}
.hoverlift:hover{box-shadow:0 4px 18px rgba(16,24,40,.09); transform:translateY(-1px);}

/* KPI card */
.kpi{padding:16px;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.kpi-val{font-family:'Space Grotesk';font-size:26px;font-weight:600;line-height:1;}
.kpi-label{color:var(--muted);font-size:12px;margin-top:6px;}
.kpi-bar{height:4px;border-radius:3px;background:var(--border-2);margin-top:10px;overflow:hidden;}
.kpi-bar > div{height:100%;border-radius:3px;}

/* pipeline */
.pipeline{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 10px;}
.pipe-step{flex:1;min-width:118px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 6px;}
.pipe-circle{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--navy-3);position:relative;z-index:2;}
:root[data-theme="dark"] .pipe-circle{color:#8FB4E8;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pipe-circle{color:#8FB4E8;}}
.pipe-line{position:absolute;top:21px;left:-50%;width:100%;height:2px;background:var(--border);z-index:1;}
.pipe-step:first-child .pipe-line{display:none;}
.pipe-title{font-size:11.5px;font-weight:700;}
.pipe-sub{font-size:10.5px;color:var(--faint);margin-top:2px;}
.pipe-flow{position:absolute;top:21px;left:-50%;width:0%;height:2px;background:var(--emerald);z-index:1;transition:width 1.1s ease;}

/* map / zones */
.field-stage{
  position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.05), transparent 40%),
    linear-gradient(135deg,#3B5D42,#26402C 60%,#1E3423);
  padding:20px; min-height:380px;
}
.zone-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; height:100%;}
.zone-cell{
  border-radius:10px; padding:10px; display:flex; flex-direction:column; justify-content:space-between;
  border:1.5px solid rgba(255,255,255,.18); cursor:pointer; min-height:105px; position:relative;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  background-blend-mode:multiply;
}
.zone-cell:hover{transform:translateY(-2px) scale(1.015); box-shadow:0 8px 20px rgba(0,0,0,.28); z-index:2;}
.zone-cell.selected{border-color:#fff; box-shadow:0 0 0 2px #fff, 0 8px 20px rgba(0,0,0,.3);}
.zone-cell.healthy{background-color:#2E8B57;}
.zone-cell.moderate{background-color:#C6820A;}
.zone-cell.critical{background-color:#B23A30;}
.zc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.zc-label{color:#fff;font-weight:700;font-size:15px;font-family:'Space Grotesk';}
.zc-pulse{width:9px;height:9px;border-radius:50%;background:#fff;}
.zone-cell.critical .zc-pulse{animation:pulse 1.6s ease infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55);}70%{box-shadow:0 0 0 9px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
.zc-bottom{color:#fff;}
.zc-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;opacity:.95;}
.zc-metric{font-size:18px;font-weight:700;font-family:'Space Grotesk';line-height:1.1;}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);}
.legend-item{display:flex;align-items:center;gap:6px;}

.layer-switch{display:flex;flex-wrap:wrap;gap:7px;}
.layer-chip{border:1px solid var(--border); background:var(--surface); padding:6px 11px; border-radius:999px; font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px;}
.layer-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}

/* side panel */
.panel-overlay{position:fixed;inset:0;background:rgba(11,18,32,.4);z-index:49;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.panel-overlay.open{opacity:1;pointer-events:auto;}
#zonepanel{
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--surface);
  border-left:1px solid var(--border); z-index:50; transform:translateX(100%); transition:transform .25s ease;
  display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#zonepanel.open{transform:translateX(0);}
.panel-head{padding:18px 18px 0;}
.panel-tabs{display:flex; gap:4px; padding:14px 18px 0; border-bottom:1px solid var(--border);}
.ptab{padding:9px 4px;margin-right:14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.ptab.active{color:var(--navy-3);border-color:var(--emerald);}
:root[data-theme="dark"] .ptab.active{color:#fff;}
.panel-body{flex:1; overflow-y:auto; padding:16px 18px 24px;}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:13px;}
.mrow:last-child{border-bottom:none;}
.mrow .mv{font-weight:700;font-family:'Space Grotesk';}

.reason-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-2);}
.reason-row:last-child{border-bottom:none;}
.reason-bar-track{background:var(--border-2);border-radius:5px;height:6px;margin-top:6px;overflow:hidden;}
.reason-bar-fill{height:100%;border-radius:5px;background:var(--navy-3);}

.rec-card{border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px; margin-bottom:10px;}
.rec-card .rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}

/* toasts */
#toasts{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:340px;}
@media(max-width:640px){#toasts{right:10px;left:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:none;}}
.toast{background:var(--navy); color:#fff; padding:12px 14px; border-radius:10px; font-size:12.8px; box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; gap:10px; align-items:flex-start; animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast b{display:block;margin-bottom:2px;}

/* tables */
table.dtab{width:100%; border-collapse:collapse; font-size:12.8px;}
table.dtab th{text-align:left; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;}
table.dtab td{padding:10px; border-bottom:1px solid var(--border-2); vertical-align:middle;}
table.dtab tr:last-child td{border-bottom:none;}
table.dtab tr:hover td{background:var(--bg);}

/* landing */
.landing-hero{padding:56px 8px 20px; text-align:center; max-width:760px; margin:0 auto;}
.landing-hero h1{font-size:clamp(28px,4.6vw,44px); font-weight:700; line-height:1.12; margin:0 0 14px;}
.landing-hero p.sub{color:var(--muted); font-size:16px; max-width:560px; margin:0 auto 26px;}
.hero-cta{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:38px;}
.problem-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:34px 0;}
@media(max-width:900px){.problem-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.problem-grid{grid-template-columns:1fr;}}
.pcard{padding:17px;}
.pcard .pnum{font-family:'Space Grotesk';font-weight:700;color:var(--emerald);font-size:12px;margin-bottom:9px;}

.tabbar{display:none;}
@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main-col{margin-left:0;}
  .hamburger{display:flex;}
  .tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:35; background:var(--surface);
    border-top:1px solid var(--border); padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .tb-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--muted); font-size:10px; font-weight:600; border-radius:8px;}
  .tb-item.active{color:var(--emerald);}
  #main-col{padding-bottom:58px;}
  .problem-grid{margin:22px 0;}
}
@media(min-width:881px){.sidebar-scrim{display:none !important;}}
.sidebar-scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;}

.metric-mini{display:flex; align-items:center; gap:10px;}
.metric-mini .mm-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.offline-strip{background:var(--amber-bg); color:var(--amber); font-size:12px; font-weight:600; padding:8px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border);}

.progress-ring{transform:rotate(-90deg);}
.two-col{display:grid; grid-template-columns:1.5fr 1fr; gap:14px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}
.chart-wrap{position:relative; height:220px;}
.chart-wrap.short{height:150px;}

input[type=range]{width:100%; accent-color:var(--emerald);}
.toggle{position:relative; width:40px; height:22px; border-radius:999px; background:var(--border); flex-shrink:0; transition:background .15s;}
.toggle.on{background:var(--emerald);}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on .knob{left:20px;}
.field-select-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip-btn{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);}
.chip-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
label.setting-lbl{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;}
</style>
</head>
<body>

<div id="app"></div>
<div id="toasts"></div>

<script>
/* ============================= ICONS ============================= */
const ICONS = {
  logo:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v6M12 16v6M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M2 12h6M16 12h6M4.9 19.1l4.2-4.2M14.9 9.1l4.2-4.2"/></svg>',
  dashboard:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  field:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/><path d="M7 3v18M17 3v18"/></svg>',
  map:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>',

/* ============================= DETERMINISTIC RNG ============================= */
function rngFrom(seedStr){
  let h = 2166136261 >>> 0;
  for (let i=0;i<seedStr.length;i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h,16777619); }
  return function(){
    h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h |= 0;
    return ((h >>> 0) % 100000) / 100000;
  };
}
function round1(n){return Math.round(n*10)/10;}
function round2(n){return Math.round(n*100)/100;}

/* ============================= DATA MODEL ============================= */
const ZONE_LETTERS = ['A','B','C','D','E','F'];

function statusFor(z){
  const m = Math.max(z.diseaseRisk, z.droughtRisk, z.floodRisk);
  if (m >= 60) return 'critical';
  if (m >= 30) return 'moderate';
  return 'healthy';
}
const STATUS_LABEL = {healthy:'Healthy', moderate:'Moderate Stress', critical:'Critical Risk'};

function genZone(seed, idx, crop){
  const r = rngFrom(seed+'-'+idx);
  const ndvi = round2(0.32 + r()*0.52);
  const soilMoisture = Math.round(14 + r()*48);
  const temperature = round1(23 + r()*11);
  const humidity = Math.round(48 + r()*40);
  const rainfall = Math.round(r()*45);
  const diseaseRisk = Math.round(r()*r()*95);
  const droughtRisk = Math.round(r()*70);
  const floodRisk = Math.round(r()*r()*55);
  const yieldEstimate = round1(2.6 + r()*2.9);
  const confidence = Math.round(76 + r()*20);
  return {
    id: seed+'-z'+idx, label: ZONE_LETTERS[idx], crop, ndvi, soilMoisture, temperature, humidity, rainfall,
    diseaseRisk, droughtRisk, floodRisk, yieldEstimate, confidence,
  };
}
function reasonsFor(z){
  const reasons = [];
  if (z.humidity >= 75) reasons.push({t:`Sustained high humidity (${z.humidity}%) over the last 48 hours`, w: Math.min(95, z.humidity+8)});
  if (z.temperature >= 29) reasons.push({t:`Above-average canopy temperature (${z.temperature}°C) accelerating pathogen activity`, w: Math.min(90, Math.round((z.temperature-20)*6))});
  if (z.ndvi < 0.65) reasons.push({t:`NDVI shows localized vegetation stress (${z.ndvi}, below field average)`, w: Math.round((0.75-z.ndvi)*160)});
  if (z.soilMoisture < 30) reasons.push({t:`Soil moisture at ${z.soilMoisture}% — water deficit compounding plant stress`, w: Math.round((35-z.soilMoisture)*2.6)});
  if (z.soilMoisture > 55) reasons.push({t:`Soil moisture at ${z.soilMoisture}% — saturation raising root-disease exposure`, w: Math.round((z.soilMoisture-45)*2)});
  if (z.rainfall > 25) reasons.push({t:`Recent rainfall of ${z.rainfall}mm increasing surface wetness`, w: Math.round(z.rainfall*1.6)});
  if (z.droughtRisk >= 40) reasons.push({t:`14-day rainfall deficit trending below seasonal norms`, w: z.droughtRisk});
  if (z.floodRisk >= 35) reasons.push({t:`Low-lying zone topography with limited drainage capacity`, w: z.floodRisk+10});
  if (reasons.length === 0) reasons.push({t:'Conditions within normal range across all monitored indicators', w: 20});
  reasons.sort((a,b)=>b.w-a.w);
  return reasons.slice(0,4).map(x=>({...x, w:Math.min(96,x.w)}));
}
function recommendationFor(z, fieldName){
  const st = statusFor(z);
  if (st === 'critical' && z.diseaseRisk >= Math.max(z.droughtRisk,z.floodRisk)){
    return {priority:'critical', title:`Inspect Zone ${z.label} within 24 hours`,
      body:`Disease risk has crossed the alert threshold in Zone ${z.label}. Field agronomy inspection is recommended before any treatment is applied.`,
      actions:['Schedule in-field inspection within 24 hours','Hold off on fertilizer application until inspection confirms cause','Monitor humidity and temperature trend over next 48 hours']};
  }
  if (st === 'critical' && z.floodRisk >= z.droughtRisk){
    return {priority:'critical', title:`Improve drainage in Zone ${z.label}`,
      body:`Flood risk is elevated in Zone ${z.label} following recent rainfall. Standing water risk may affect root health.`,
      actions:['Check and clear drainage channels near this zone','Postpone irrigation until soil moisture normalizes','Re-inspect after next rainfall event']};
  }
  if (st === 'critical'){
    return {priority:'critical', title:`Prioritize irrigation for Zone ${z.label}`,
      body:`Drought stress indicators are elevated. Soil moisture is trending well below the crop's optimal range for this growth stage.`,
      actions:['Schedule irrigation within 24–48 hours','Reduce evapotranspiration loss with mulching where possible','Recheck soil moisture after irrigation']};
  }
  if (st === 'moderate'){
    return {priority:'moderate', title:`Monitor Zone ${z.label} closely`,
      body:`Zone ${z.label} shows early signs of stress. No immediate action required, but conditions should be tracked over the coming days.`,
      actions:['Re-scan zone in 48–72 hours','Maintain standard irrigation schedule','Flag for next routine inspection']};
  }
  return {priority:'low', title:`Zone ${z.label} is on track`,
    body:`All monitored indicators for Zone ${z.label} are within healthy range for ${fieldName}.`,
    actions:['No action required','Continue standard monitoring cadence']};
}

function buildField(farmSeed, fieldId, fieldName, crop, area, stage, overrideZones){
  let zones;
  if (overrideZones){
    zones = overrideZones;
  } else {
    zones = ZONE_LETTERS.map((_,i)=>genZone(farmSeed+'-'+fieldId, i, crop));
  }
  zones.forEach(z=>{ z.status = statusFor(z); z.reasons = reasonsFor(z); z.recommendation = recommendationFor(z, fieldName); });
  return {id:fieldId, name:fieldName, crop, area, stage, zones};
}

function onFarmChange(id){
  STATE.farmId = id;

  STATE.fieldId = farm.fields[0].id;

  toast('Farm switched', `Now viewing ${farm.name}.`);

/* ============================= VIEW ROUTER ============================= */
function renderView(farm){
  switch(STATE.view){
    case 'home': return viewHome();
    case 'dashboard': return viewDashboard(farm);
    case 'field': return viewField(farm);
    case 'map': return viewMap(farm);
    case 'weather': return viewWeather(farm);
    case 'soil': return viewSoil(farm);
    case 'crop': return viewCrop(farm);
    case 'disease': return viewDisease(farm);
    case 'droughtflood': return viewDroughtFlood(farm);
    case 'yield': return viewYield(farm);
    case 'explainable': return viewExplainable(farm);
    case 'recommendations': return viewRecommendations(farm);
    case 'alerts': return viewAlerts(farm);
    case 'datasources': return viewDataSources();
    case 'model': return viewModel();
    case 'settings': return viewSettings(farm);
    default: return viewHome();
  }
}
function mountView(farm){
  if (STATE.view==='dashboard') mountDashboard(farm);
  if (STATE.view==='field') mountField(farm);
  if (STATE.view==='weather') mountWeather(farm);
  if (STATE.view==='soil') mountSoil(farm);
  if (STATE.view==='crop') mountCrop(farm);
  if (STATE.view==='disease') mountDisease(farm);
  if (STATE.view==='droughtflood') mountDroughtFlood(farm);
  if (STATE.view==='yield') mountYield(farm);
  if (STATE.view==='home') mountHome();
  animatePipelines();
}

function kpiCard(icon, color, label, value, sub, barPct){
  const colorMap = {emerald:['var(--green-bg)','var(--emerald-dk)'], amber:['var(--amber-bg)','var(--amber)'], red:['var(--red-bg)','var(--red)'], blue:['var(--blue-bg)','var(--blue)'], navy:['var(--bg)','var(--navy-3)']};
  const [bg,fg] = colorMap[color]||colorMap.navy;
  return `<div class="card kpi hoverlift">

      <div class="kpi-icon" style="background:${bg};color:${fg}">${ic(icon)}</div>

function zoneGridHtml(field, layerKey){
  const layerVal = (z)=>{
    switch(layerKey){
      case 'cropHealth': return {v:Math.round(z.ndvi*100)+'', unit:'', st: z.ndvi>=0.7?'healthy':z.ndvi>=0.5?'moderate':'critical'};
      case 'ndvi': return {v:z.ndvi.toFixed(2), unit:'', st: z.ndvi>=0.7?'healthy':z.ndvi>=0.5?'moderate':'critical'};
      case 'soilMoisture': return {v:z.soilMoisture, unit:'%', st: z.soilMoisture>=35?'healthy':z.soilMoisture>=20?'moderate':'critical'};
      case 'temperature': return {v:z.temperature, unit:'°C', st: z.temperature<28?'healthy':z.temperature<32?'moderate':'critical'};
      case 'rainfall': return {v:z.rainfall, unit:'mm', st: z.rainfall<20?'healthy':z.rainfall<40?'moderate':'critical'};
      case 'diseaseRisk': return {v:z.diseaseRisk, unit:'%', st: z.diseaseRisk<30?'healthy':z.diseaseRisk<60?'moderate':'critical'};
      case 'droughtRisk': return {v:z.droughtRisk, unit:'%', st: z.droughtRisk<30?'healthy':z.droughtRisk<60?'moderate':'critical'};
      case 'floodRisk': return {v:z.floodRisk, unit:'%', st: z.floodRisk<30?'healthy':z.floodRisk<60?'moderate':'critical'};
      default: return {v:'-', unit:'', st:z.status};
    }
  };
  return `<div class="zone-grid">
    ${field.zones.map(z=>{
      const lv = layerVal(z);
      return `<div class="zone-cell ${lv.st} ${STATE.zoneId===z.id?'selected':''}" onclick="openZone('${z.id}')" role="button" tabindex="0" aria-label="Zone ${z.label}, ${STATE.zoneId} status ${STATUS_LABEL[lv.st]}">

          <div class="zc-status">${STATUS_LABEL[lv.st]}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function viewField(farm){
  const field = getField(farm, STATE.fieldId);

  const soil = Math.min(100, Math.round(avg('soilMoisture')*1.7));
  const weatherScore = Math.max(0, 100-Math.round(avg('temperature')*1.6));
  const water = Math.max(0, 100-Math.round((100-avg('soilMoisture'))*0.9));

  return `

          <div style="color:var(--muted);font-size:14px;">/ 100</div>
          <span class="badge ${overall>=75?'green':overall>=55?'amber':'red'}" style="margin-left:auto">${overall>=75?'Healthy':overall>=55?'Moderate':'Needs attention'}</span>
        </div>
        ${[['Vegetation',vegetation,'leaf'],['Soil',soil,'soil'],['Weather',weatherScore,'weather'],['Water',water,'drop'],['Disease',disease,'bug']].map(([l,v,i])=>`

            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;"><span style="display:flex;align-items:center;gap:6px;color:var(--muted)">${ic(i)} ${l}</span><b>${v}</b></div>

function mountField(farm){
  const field = getField(farm, STATE.fieldId);
  const labels = Array.from({length:30},(_,i)=>'D'+(i+1));
  const seed = STATE.farmId+STATE.fieldId;
  const ndvi = series(seed+'ndvi',30,0.68,0.22).map(v=>Math.max(0.2,Math.min(0.95,v)));
  const disease = series(seed+'dis',30,35,40).map(v=>Math.max(2,Math.min(90,v)));

function sendAlert(zoneId){
  const farm = getFarm(STATE.farmId);
  let field, z;
  for (const f of farm.fields){ const found = getZone(f, zoneId); if(found){ z=found; field=f; break; } }
  if (!z) return;
  const msg = `Alert (${field.name}): ${z.recommendation.title.replace(/^\w+ zone \w+ /i,'')} — ${z.status==='critical'?'high risk detected':'monitor recommended'} in Zone ${z.label}. Reply HELP for details.`;
  const alert = {id:'al-'+Date.now(), ts:'Just now', field:`${farm.name} · ${field.name}`, zone:z.label, message:msg, channel:'App + SMS', status:'Sent'};
  STATE.alerts.unshift(alert);
  toast('Farmer alert sent', `${field.name} · Zone ${z.label} — delivered via App + SMS.`);
  render();
}

/* ============================= EXPLAINABLE AI ============================= */
function viewExplainable(farm){
  const field = getField(farm, STATE.fieldId);
  const topZone = field.zones.slice().sort((a,b)=>Math.max(b.diseaseRisk,b.droughtRisk,b.floodRisk)-Math.max(a.diseaseRisk,a.droughtRisk,a.floodRisk))[0];
  return `
  <div class="grid" style="gap:16px;">
    <div class="card card-pad">
      <div class="section-title">Why did the AI generate this prediction?</div>
      <div class="section-sub">Every risk score is backed by a transparent, weighted breakdown of the fused inputs behind it — never a black box.</div>
      ${pipelineHtml('explain')}
    </div>
    <div class="two-col">
      <div class="card card-pad">
        <div class="section-title">Featured: Zone ${topZone.label}, ${field.name}</div>
        <div class="section-sub">Highest combined risk signal in the selected field right now.</div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <span class="badge ${statusBadgeClass(topZone.status)}">${STATUS_LABEL[topZone.status]}</span>
          ${confidenceBadge(topZone.confidence)}
        </div>
        ${panelExplain(topZone)}
      </div>
      <div class="card card-pad">
        <div class="section-title">Model Inputs Used</div>
        <div class="section-sub">Multimodal fusion for this prediction</div>
        ${[['sat','Sentinel-2 Optical Imagery','10m resolution, 5-day revisit'],['radar','Sentinel-1 SAR Radar','Cloud-penetrating, 12-day revisit'],['weather','Weather API','Hourly downscaled forecast'],['soil','Soil Sensor Network','IoT, 15-min interval'],['leaf','Historical Farm Records','3-season baseline']].map(([i,t,s])=>`
          <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border-2);">
            <div style="width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--navy-3);flex-shrink:0;">${ic(i)}</div>
            <div><div style="font-weight:600;font-size:12.8px;">${t}</div><div style="color:var(--muted);font-size:11.5px;">${s}</div></div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ============================= RECOMMENDATIONS ============================= */
function viewRecommendations(farm){
  const all = [];
  farm.fields.forEach(f=>f.zones.forEach(z=>all.push({z, f})));
  all.sort((a,b)=>({critical:0,moderate:1,low:2})[a.z.recommendation.priority]-({critical:0,moderate:1,low:2})[b.z.recommendation.priority]);
  return `
  <div class="grid" style="gap:16px;">
    <div class="card card-pad">
      <div class="section-title">Actionable Recommendations</div>
      <div class="section-sub">Generated automatically from zone-level risk predictions across ${farm.name}. AI supports farmer judgment — it does not replace it.</div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));">
      ${all.map(({z,f})=>`
        <div class="card card-pad hoverlift">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
            <span class="badge ${z.recommendation.priority==='critical'?'red':z.recommendation.priority==='moderate'?'amber':'green'}">${z.recommendation.priority.toUpperCase()}</span>
            ${confidenceBadge(z.confidence)}
          </div>
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${z.recommendation.title}</div>
          <div style="color:var(--muted);font-size:11.8px;margin-bottom:8px;">${f.name} · Zone ${z.label}</div>
          <p style="font-size:12.6px;color:var(--text);margin:0 0 10px;">${z.recommendation.body}</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-sm" onclick="STATE.fieldId='${f.id}';openZone('${z.id}')">View zone</button>
            <button class="btn btn-primary btn-sm" onclick="STATE.fieldId='${f.id}';sendAlert('${z.id}')">${ic('send')} Alert</button>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

/* ============================= DEMO MODE ============================= */
function runDemo(){
  if (STATE.demoRunning) return;
  STATE.demoRunning = true;
  STATE.farmId = 'green-valley';
  STATE.fieldId = 'field-02';
  STATE.zoneId = null;
  STATE.panelOpen = false;
  STATE.activeLayer = 'diseaseRisk';
  navigate('map');
  toast('Demo mode started', 'Green Valley Farm · Field 02 — walking through the full pipeline.');
  setTimeout(()=>{ openZone('field-02-zC'); toast('Zone C flagged', 'Disease risk 72% — above the 60% alert threshold.'); }, 1200);
  setTimeout(()=>{ STATE.panelTab='explain'; render(); toast('Explaining risk', 'AI reasoning generated from fused humidity, temperature, NDVI and soil signals.'); }, 2600);
  setTimeout(()=>{ STATE.panelTab='recommend'; render(); toast('Recommendation ready', '"Inspect Zone C within 24 hours."'); }, 4000);
  setTimeout(()=>{ toast('Weather check', 'Heavy rainfall expected — postponing fertilizer application field-wide.'); }, 5400);
  setTimeout(()=>{ sendAlert('field-02-zC'); }, 6600);
  setTimeout(()=>{ navigate('alerts'); toast('Demo complete', 'Risk detected → explained → recommended → alert sent.'); STATE.demoRunning=false; }, 7600);
}

render();
